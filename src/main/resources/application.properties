## PostgreSQL Database Configuration (Supabase)
#spring.datasource.url=jdbc:postgresql://localhost:5432/homify_dev
#spring.datasource.username=postgres
#spring.datasource.password=bigK2909@
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Zestimate ML Configuration
zestimate.python.path=python
zestimate.script.path=ml/predict.py
zestimate.timeout.seconds=30



logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG
server.address=0.0.0.0
