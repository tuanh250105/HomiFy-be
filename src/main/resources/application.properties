server.port=8080
spring.application.name=homify-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/homify_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

logging.level.root=INFO
logging.level.com.homifybackend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.homifybackend.agentsforcustomer=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.jackson.time-zone=UTC

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# ADDED FOR AGENT MODULE (Spring Boot 4.0 Compatible)
# ====================================

# CORS Configuration
# Comma-separated list of allowed origins for CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Jackson (JSON) Configuration
# Date format for JSON responses
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Pretty print JSON (development only)
spring.jackson.serialization.indent-output=true

# ====================================