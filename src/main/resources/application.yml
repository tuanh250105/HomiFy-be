server:
  port: ${SERVER_PORT}

spring:
  application:
    name: homify-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8
    from: ${MAIL_FROM}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:2592000000}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

  otp:
    expiration-minutes: ${OTP_EXPIRATION}
    length: ${OTP_LENGTH}

  frontend:
    url: ${FRONTEND_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.homifybackend: INFO
    com.homifybackend.auth.service.GoogleOAuthService: DEBUG
